[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "field-farms-data"
version = "0.1.0"
description = "Procesos de datos ambientales y territoriales de Field Farms Challenge"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "pyproj>=3.6", "pyshp>=2.3", "shapely>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
recovery = ["numpy>=2", "rasterio>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
