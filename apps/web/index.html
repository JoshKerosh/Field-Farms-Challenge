<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('ffc.preferences.v1') || '{}') || {};
        const theme =
          saved.theme === 'light' || saved.theme === 'dark'
            ? saved.theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17617C" />
    <meta
      name="description"
      content="Conocé tu cuenca, cuidá tu finca y registrá el agua de tu comunidad. Base demostrativa de Sow Water."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Sow Water · El agua se siembra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
